---
- name: Install libraries (see https://itsfoss.com/appimage-fuse-issue/)
  apt:
    name: "{{ packages }}"
  vars:
    packages:
    - libfuse2t64
    - libopengl0
    - flatpak

- name: Add the flathub flatpak repository remote to the user installation
  community.general.flatpak_remote:
    name: flathub
    state: present
    flatpakrepo_url: https://dl.flathub.org/repo/flathub.flatpakrepo


#- name: Install gear lever
#  community.general.flatpak:
#    name:
#      - it.mijorus.gearlever

# In fact the kdrive version is not even complete, there is some kind of a hash added
# So do a lookup
- name: Check if we should download kDrive
  find: 
    paths: "{{home_folder}}/AppImages/"
    file_type: file
    use_regex: yes
    patterns: "kdrive.*"
  register: kdrive_exists

- name: Download kdrive AppImage
  get_url:
    owner: "{{ansible_user}}"
    url: "https://download.storage.infomaniak.com/drive/desktopclient/kDrive-3.8.2.6-amd64.AppImage"
    dest: "{{download_folder}}"
  when: kdrive_exists.matched == False

- name: Now use Gear Lever to install kDrive in app image folder
  wait_for:
    path: "{{home_folder}}/AppImages/kdrive.appimage"

- name: Now that kdrive is installed, connect to personnal account to have all data sync'ed
  wait_for:
    path: "{{home_folder}}/kDrive"